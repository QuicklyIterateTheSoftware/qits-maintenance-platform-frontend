# The pipeline qits-ci runs on every push to a tracked branch of this repository.
#
# One ordinary sandboxed step, and no image: this repository does not ship a container. The app is
# packaged and served by qits-platform-maintenance, which carries this repo as a git submodule at
# service/src/main/webui — Quinoa's ui-dir — and builds it into the service image at /maintenance/,
# so this pipeline's job is to keep main green (install, lint, test, build), and the own pipeline of
# qits-platform-maintenance is where the bundle becomes deployable. THE PATTERN'S HOME IS
# qits-platform-spa-idp; this recipe follows it rather than re-deriving it, and the two should keep
# matching.
#
# Read the install step below with one extra fact in mind: the registries it installs from are two
# other services on this platform. A run here cannot be green while qits-platform-mirror is down —
# it holds the npmjs pull-through cache — and it cannot be green while qits-artifacts is down
# either, because the @qits scope lives there. Both services' deploys are taken alone and with the
# CI queue empty.
steps:
  - image: qits/build-images/node-base:latest
    timeout-seconds: 1800
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this an early failure would be
      # swallowed by the next command's exit code. -u is load-bearing too: an unset registry var
      # must stop the step, not quietly resolve the @qits scope against npmjs.org, where these
      # packages do not exist and never will.
      set -eu

      # THE LOCKFILE is the one file this step edits, and npm leaves no alternative.
      #
      # npm pins a full resolved URL per package, and this lockfile is generated on the deployment
      # host, so every entry names an edge address that does not exist in this container. `npm ci`
      # fetches tarballs by that URL and never asks the configured registry for them, so the
      # environment below does not reach them: without this swap the install dies on connection
      # refused. The paths are identical on every address, so replacing the ORIGIN and keeping the
      # path is all it takes, and the integrity hashes are what make that safe — bytes from the
      # other address must still hash the same. The clone is this step's own; nothing is edited that
      # anyone will ever read again.
      #
      # THE BYTE PLANE IS TWO SERVICES, WHICH IS WHY THE SWAP READS THE PATH. qits-platform-mirror
      # holds the npmjs pull-through cache; qits-artifacts hosts the @qits scope. No single origin
      # serves both, so the path is what tells them apart: an entry under the hosted registry's own
      # pathname — $QITS_NPM_REGISTRY_URL's, /artifacts/npm/npm/ — is a @qits tarball and gets the
      # hosted origin, and every other entry gets the proxy's. Flattening all of them to one origin
      # sends every @qits tarball to the mirror, which has never held one: 404, on every run.
      #
      # THE ORDER OF THE TWO EXPRESSIONS IS THE WHOLE TRICK. sed applies -e in sequence per line,
      # so the broad proxy swap runs FIRST and the narrow path-anchored one corrects the @qits
      # entries after it. The other order lets the broad expression undo the narrow one.
      #
      # npm's own knob for exactly this, `--replace-registry-host=always`, cannot do it against a
      # registry mounted under a path, and could not have told two registries apart either —
      # qits-workspaces' recipe measures that failure in full.
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      # ENVIRONMENT, not a file. This repository COMMITS an .npmrc (registry.dev.localhost:8080 for
      # @qits and mirror.dev.localhost:8080 for npmjs, right for a developer on the host), and npm
      # ranks a project .npmrc ABOVE ~/.npmrc — so a `cat > ~/.npmrc` preamble would be written and
      # silently ignored. `npm_config_*` environment outranks both files, so it wins without
      # touching the tree.
      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      npm run lint

      # The jsdom target. This image has no browser and CI is not the place to download one.
      npm run test

      npm run build
